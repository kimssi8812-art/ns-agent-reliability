<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">NS Agent Reliability Doctor terminal demo</title>
  <desc id="desc">A terminal-style preview showing the Doctor finding critical and high reliability failures.</desc>
  <rect width="980" height="430" rx="18" fill="#0d1117"/>
  <rect x="1" y="1" width="978" height="428" rx="17" fill="none" stroke="#30363d"/>
  <circle cx="32" cy="30" r="6" fill="#ff7b72"/>
  <circle cx="52" cy="30" r="6" fill="#d29922"/>
  <circle cx="72" cy="30" r="6" fill="#3fb950"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
    <text x="28" y="72" fill="#8b949e">$ ns-reliability examples/doctor_broken_system.json</text>
    <text x="28" y="112" fill="#f0f6fc" font-weight="700">Agent Reliability Doctor: 15 finding(s)</text>
    <text x="28" y="152" fill="#ff7b72">[CRITICAL] DUPLICATE_AUTHORITY</text>
    <text x="52" y="179" fill="#c9d1d9">target=run_state; writers=scheduler_a,recovery_b</text>
    <text x="28" y="218" fill="#d29922">[HIGH] UNBOUNDED_RETRY</text>
    <text x="52" y="245" fill="#c9d1d9">max_attempts=None</text>
    <text x="28" y="284" fill="#ff7b72">[CRITICAL] AUTHORITY_LEAKAGE</text>
    <text x="52" y="311" fill="#c9d1d9">read tool can mutate: read_anything</text>
    <text x="28" y="350" fill="#ff7b72">[CRITICAL] ROLLBACK_RESURRECTS_DEPRECATED_SURFACE</text>
    <text x="52" y="377" fill="#c9d1d9">restored=legacy-tool-surface</text>
    <text x="28" y="410" fill="#8b949e">… 11 more evidence-backed findings</text>
  </g>
</svg>
