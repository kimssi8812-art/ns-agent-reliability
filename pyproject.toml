[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ns-agent-reliability"
version = "0.1.0rc1"
description = "Agent reliability diagnostics and reference reliability/control-plane contracts derived from real operational incidents"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "NS project contributors"}]

[project.scripts]
ns-reliability = "ns_agent_reliability.doctor:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
