name: Reliability Audit Fit Check
about: Public, no-secret fit check for MCP / agent reliability audit services
title: "[Audit fit] "
labels: ["audit-fit"]
body:
  - type: markdown
    attributes:
      value: |
        ## Public intake — do not share secrets
        This issue is public. Do not include credentials, tokens, private repository links, customer PII, private endpoints, proprietary logs, or confidential architecture details.
        A high-level symptom is enough for the first fit check.
  - type: dropdown
    id: stage
    attributes:
      label: Current stage
      options:
        - Production
        - Late staging / pilot
        - Early staging
        - Demo / prototype only
    validations:
      required: true
  - type: dropdown
    id: offer
    attributes:
      label: Most relevant scope
      options:
        - MCP Surface & Contract Quick Audit
        - AI Agent Reliability Audit
        - Safe Deployment Hardening Sprint
        - Not sure — help me choose
    validations:
      required: true
  - type: checkboxes
    id: symptoms
    attributes:
      label: Symptoms observed
      options:
        - label: Duplicate or repeated execution
        - label: Stale state / stale ownership
        - label: Retry or resume behaves unexpectedly
        - label: Agent says done but the external result is missing
        - label: MCP/tool surface or schema drift
        - label: Read/write authority boundary is unclear
        - label: Deploy/rollback can restore old behavior
        - label: Other reliability/control issue
  - type: textarea
    id: stack
    attributes:
      label: High-level stack
      description: Public/non-sensitive names only, for example LangGraph + MCP + Postgres.
      placeholder: "Frameworks/runtime/tooling only — no private URLs or code."
    validations:
      required: true
  - type: textarea
    id: symptom
    attributes:
      label: One high-level failure example
      description: Describe what was expected and what happened without confidential details.
    validations:
      required: true
  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Public-data acknowledgement
      options:
        - label: I understand this is a public GitHub issue and I have not included confidential or sensitive material.
          required: true
